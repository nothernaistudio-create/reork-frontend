<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REORK</title>

  <style>
    :root{
      --bg:#101012;
      --bg2:#151517;
      --panel:#1a1a1e;
      --panel2:#202025;
      --border:#313138;
      --text:#f2f2f4;
      --muted:#a7a7b0;
      --soft:#74747e;
      --accent:#ff5a1f;
      --accent2:#ff7a3d;
      --user:#242429;
      --shadow:0 18px 50px rgba(0,0,0,.34);
      --radius:18px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      height:100vh;
      overflow:hidden;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 520px at 10% 0%, rgba(255,90,31,.13), transparent 55%),
        radial-gradient(700px 420px at 90% 10%, rgba(255,255,255,.045), transparent 60%),
        linear-gradient(180deg, #111113, #0d0d0f);
      display:flex;
      flex-direction:column;
    }

    header{
      height:86px;
      display:flex;
      align-items:center;
      padding:0 28px;
      flex:0 0 auto;
    }

    .brand{
      font-weight:900;
      letter-spacing:.8px;
      color:var(--accent);
      font-size:34px;
      text-shadow:0 8px 34px rgba(255,90,31,.22);
    }

    .brand .big{
      font-size:44px;
      line-height:1;
      display:inline-block;
      transform:translateY(2px);
    }

    .brand .mid{
      font-size:30px;
      display:inline-block;
      margin:0 1px;
    }

    #app{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      max-width:1180px;
      width:100%;
      margin:0 auto;
      padding:0 22px 18px;
    }

    #chat{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:14px 4px 26px;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,.16) transparent;
    }

    #chat::-webkit-scrollbar{ width:10px; }
    #chat::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.14);
      border-radius:10px;
      border:2px solid transparent;
      background-clip:padding-box;
    }

    .row{
      display:flex;
      margin:18px 0;
      width:100%;
    }

    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .bubble{
      max-width:min(760px, 86%);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:17px 18px 13px;
      line-height:1.58;
      font-size:16px;
      white-space:pre-wrap;
      word-break:break-word;
      box-shadow:var(--shadow);
    }

    .bot .bubble{
      background:linear-gradient(180deg, rgba(32,32,37,.96), rgba(25,25,29,.96));
      border-left:4px solid var(--accent);
    }

    .user .bubble{
      background:var(--user);
      border-color:rgba(255,255,255,.10);
    }

    .message-text{
      white-space:pre-wrap;
      word-break:break-word;
    }

    .meta{
      margin-top:10px;
      color:var(--soft);
      font-size:12px;
      letter-spacing:.2px;
    }

    .file-stack{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:12px;
    }

    .file-card{
      display:flex;
      align-items:center;
      gap:12px;
      background:rgba(255,90,31,.10);
      border:1px solid rgba(255,90,31,.28);
      border-radius:14px;
      padding:12px 14px;
      max-width:100%;
    }

    .file-icon{
      font-size:22px;
      flex:0 0 auto;
    }

    .file-info{
      min-width:0;
      flex:1;
    }

    .file-name{
      font-size:14px;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .file-status{
      font-size:12px;
      color:rgba(255,255,255,.68);
      margin-top:2px;
    }

    #composer{
      flex:0 0 auto;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(18,18,21,.92);
      border-radius:22px;
      padding:12px;
      box-shadow:0 20px 70px rgba(0,0,0,.42);
      backdrop-filter:blur(10px);
    }

    #attachPillWrap{
      display:none;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:10px;
    }

    .attach-pill{
      display:inline-flex;
      align-items:center;
      gap:10px;
      max-width:100%;
      background:rgba(255,90,31,.11);
      border:1px solid rgba(255,90,31,.30);
      border-radius:999px;
      padding:9px 11px;
    }

    .attach-pill .tag{
      font-size:11px;
      font-weight:800;
      color:#1a1a1a;
      background:var(--accent);
      padding:3px 8px;
      border-radius:999px;
      flex:0 0 auto;
    }

    .attach-pill .name{
      font-size:13px;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:330px;
    }

    .attach-pill .ready{
      font-size:12px;
      color:rgba(255,255,255,.70);
      flex:0 0 auto;
    }

    .attach-pill button{
      border:none;
      background:transparent;
      color:rgba(255,255,255,.78);
      cursor:pointer;
      font-size:18px;
      padding:0 4px;
      line-height:1;
    }

    #composeRow{
      display:flex;
      align-items:flex-end;
      gap:10px;
    }

    #attachBtn,
    #micBtn,
    #sendBtn{
      height:54px;
      border:none;
      border-radius:15px;
      cursor:pointer;
      font-weight:900;
      flex:0 0 auto;
    }

    #attachBtn,
    #micBtn{
      width:54px;
      background:linear-gradient(180deg, var(--accent2), var(--accent));
      color:#171717;
      box-shadow:0 12px 30px rgba(255,90,31,.20);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #attachBtn span{
      font-size:32px;
      font-weight:900;
      transform:translateY(-2px);
    }

    #micBtn{
      opacity:.55;
    }

    #micIcon{
      font-size:20px;
    }

    #inputBox{
      flex:1;
      min-width:0;
    }

    #input{
      width:100%;
      min-height:54px;
      max-height:160px;
      resize:none;
      border:none;
      outline:none;
      border-radius:15px;
      padding:16px 16px;
      color:var(--text);
      background:#0f0f11;
      font-size:16px;
      font-family:Arial, Helvetica, sans-serif;
      line-height:1.4;
    }

    #input:focus{
      box-shadow:0 0 0 2px rgba(255,90,31,.45);
    }

    #sendBtn{
      padding:0 22px;
      background:linear-gradient(180deg, var(--accent2), var(--accent));
      color:#171717;
      box-shadow:0 12px 30px rgba(255,90,31,.20);
    }

    #sendBtn:disabled,
    #attachBtn:disabled,
    #micBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
      box-shadow:none;
    }

    #hint{
      display:flex;
      justify-content:space-between;
      gap:14px;
      margin-top:10px;
      padding:0 4px;
      font-size:12px;
      color:rgba(255,255,255,.45);
    }

    #statusText{
      color:rgba(255,255,255,.70);
    }

    #fileInput{
      display:none;
    }

    @media (max-width:820px){
      header{
        height:76px;
        padding:0 18px;
      }

      .brand{ font-size:28px; }
      .brand .big{ font-size:38px; }
      .brand .mid{ font-size:25px; }

      #app{
        padding:0 12px 12px;
      }

      .bubble{
        max-width:92%;
        font-size:15px;
      }

      #composeRow{
        gap:8px;
      }

      #attachBtn,
      #micBtn{
        width:50px;
        height:50px;
      }

      #sendBtn{
        height:50px;
        padding:0 16px;
      }

      #input{
        min-height:50px;
      }

      .attach-pill .name{
        max-width:170px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <span class="big">R</span><span class="mid">EOR</span><span class="big">K</span>
    </div>
  </header>

  <div id="app">
    <div id="chat"></div>

    <div id="composer">
      <div id="attachPillWrap"></div>

      <div id="composeRow">
        <button id="attachBtn" type="button" title="Attach files">
          <span>+</span>
        </button>

        <button id="micBtn" type="button" title="Voice input disabled for now">
          <span id="micIcon">🎤</span>
        </button>

        <div id="inputBox">
          <textarea id="input" placeholder="Ask REORK anything..."></textarea>
        </div>

        <button id="sendBtn" type="button">Send</button>
      </div>

      <div id="hint">
        <div id="statusText"></div>
        <div>Enter to send • Shift+Enter for new line</div>
      </div>

      <input
        id="fileInput"
        type="file"
        multiple
        accept=".pdf,.png,.jpg,.jpeg,.webp,.csv,.txt,.md,.json,.doc,.docx,.xls,.xlsx"
      />
    </div>
  </div>

<script>
const API_URL = "https://reork-backend.onrender.com/api/chat";
const FRONTEND_CONTEXT_LIMIT = 10;

let messages = [];
let attachedFiles = [];

let sessionId = localStorage.getItem("reork_sessionId");
if (!sessionId) {
  sessionId = "sess_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("reork_sessionId", sessionId);
}

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const micBtn = document.getElementById("micBtn");
const fileInput = document.getElementById("fileInput");
const attachPillWrap = document.getElementById("attachPillWrap");
const statusText = document.getElementById("statusText");

function nowTime() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${hh}:${mm}`;
}

function setStatus(text) {
  statusText.textContent = text || "";
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function getTrimmedContext() {
  if (messages.length <= FRONTEND_CONTEXT_LIMIT) return messages;
  return messages.slice(messages.length - FRONTEND_CONTEXT_LIMIT);
}

function ensureApiConfigured() {
  if (!API_URL) {
    addAssistantText("Backend URL is missing.");
    return false;
  }
  return true;
}

function disableWhileWorking(on) {
  sendBtn.disabled = !!on;
  attachBtn.disabled = !!on;
  micBtn.disabled = !!on;
}

function getFileIcon(name = "") {
  const lower = name.toLowerCase();

  if (lower.endsWith(".pdf")) return "📄";
  if (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".webp")) return "🖼️";
  if (lower.endsWith(".csv") || lower.endsWith(".xls") || lower.endsWith(".xlsx")) return "📊";
  if (lower.endsWith(".doc") || lower.endsWith(".docx")) return "📝";
  return "📎";
}

function getFileTag(name = "", type = "") {
  const lower = name.toLowerCase();
  const t = (type || "").toLowerCase();

  if (t.includes("pdf") || lower.endsWith(".pdf")) return "PDF";
  if (t.includes("png") || lower.endsWith(".png")) return "PNG";
  if (t.includes("jpeg") || t.includes("jpg") || lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "JPG";
  if (lower.endsWith(".webp")) return "WEBP";
  if (lower.endsWith(".csv")) return "CSV";
  if (lower.endsWith(".xls") || lower.endsWith(".xlsx")) return "XLS";
  if (lower.endsWith(".doc") || lower.endsWith(".docx")) return "DOC";
  if (lower.endsWith(".txt")) return "TXT";
  return "FILE";
}

function createRow(who) {
  const row = document.createElement("div");
  row.className = "row " + (who === "user" ? "user" : "bot");
  return row;
}

function createBubble() {
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  return bubble;
}

function createMeta(who) {
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (who === "user" ? "You" : "REORK") + " • " + nowTime();
  return meta;
}

function createFileStack(files) {
  const stack = document.createElement("div");
  stack.className = "file-stack";

  files.forEach(file => {
    const card = document.createElement("div");
    card.className = "file-card";

    const icon = document.createElement("span");
    icon.className = "file-icon";
    icon.textContent = getFileIcon(file.name);

    const info = document.createElement("div");
    info.className = "file-info";

    const name = document.createElement("div");
    name.className = "file-name";
    name.textContent = file.name;

    const status = document.createElement("div");
    status.className = "file-status";
    status.textContent = "Attached and sent to REORK";

    info.appendChild(name);
    info.appendChild(status);

    card.appendChild(icon);
    card.appendChild(info);
    stack.appendChild(card);
  });

  return stack;
}

function addAssistantText(text) {
  messages.push({ role: "assistant", content: text });

  const row = createRow("assistant");
  const bubble = createBubble();

  const content = document.createElement("div");
  content.className = "message-text";
  content.textContent = text;

  bubble.appendChild(content);
  bubble.appendChild(createMeta("assistant"));
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function addUserMessage(text, files = []) {
  const contentParts = [];
  if (files.length) {
    contentParts.push(files.map(f => f.name).join("\n"));
  }
  if (text) contentParts.push(text);

  messages.push({ role: "user", content: contentParts.join("\n\n") });

  const row = createRow("user");
  const bubble = createBubble();

  if (files.length) {
    bubble.appendChild(createFileStack(files));
  }

  if (text) {
    const content = document.createElement("div");
    content.className = "message-text";
    content.textContent = text;
    bubble.appendChild(content);
  }

  bubble.appendChild(createMeta("user"));
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function renderAttachmentPills() {
  attachPillWrap.innerHTML = "";

  if (!attachedFiles.length) {
    attachPillWrap.style.display = "none";
    return;
  }

  attachPillWrap.style.display = "flex";

  attachedFiles.forEach((file, index) => {
    const pill = document.createElement("div");
    pill.className = "attach-pill";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = getFileTag(file.name, file.type);

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = file.name;

    const ready = document.createElement("span");
    ready.className = "ready";
    ready.textContent = "attached";

    const remove = document.createElement("button");
    remove.type = "button";
    remove.title = "Remove";
    remove.textContent = "×";
    remove.addEventListener("click", () => {
      attachedFiles.splice(index, 1);
      renderAttachmentPills();
      setStatus(attachedFiles.length ? "File ready to send." : "");
    });

    pill.appendChild(tag);
    pill.appendChild(name);
    pill.appendChild(ready);
    pill.appendChild(remove);
    attachPillWrap.appendChild(pill);
  });
}

function clearAttachments() {
  attachedFiles = [];
  fileInput.value = "";
  renderAttachmentPills();
}

async function sendSingleRequest(userText, file) {
  const fd = new FormData();
  fd.append("message", userText || "");
  fd.append("sessionId", sessionId);
  fd.append("history", JSON.stringify(getTrimmedContext()));

  if (file) {
    fd.append("file", file, file.name);
  }

  const resp = await fetch(API_URL, { method: "POST", body: fd });

  if (!resp.ok) {
    const t = await resp.text().catch(() => "");
    throw new Error(`Backend error (${resp.status}): ${t || resp.statusText}`);
  }

  const contentType = resp.headers.get("content-type") || "";
  if (contentType.includes("application/json")) {
    const data = await resp.json();
    return (data.reply || data.response || data.message || "").toString();
  }

  return (await resp.text()).toString();
}

async function handleSend() {
  const text = inputEl.value.trim();
  const files = [...attachedFiles];

  if (!text && !files.length) return;
  if (!ensureApiConfigured()) return;

  addUserMessage(text, files);

  inputEl.value = "";
  clearAttachments();

  disableWhileWorking(true);
  setStatus(files.length ? "Reading file..." : "Thinking...");

  try {
    if (!files.length) {
      const reply = await sendSingleRequest(text || "");
      addAssistantText(reply && reply.trim() ? reply.trim() : "I didn’t get a response back. Send it again and I’ll try again.");
    } else {
      const results = [];

      for (const file of files) {
        setStatus(`Reading ${file.name}...`);
        const prompt = text || "Please explain what this says.";
        const reply = await sendSingleRequest(prompt, file);

        results.push(`${getFileIcon(file.name)} ${file.name}\n\n${reply && reply.trim() ? reply.trim() : "No response returned."}`);
      }

      addAssistantText(results.join("\n\n"));
    }
  } catch (err) {
    addAssistantText(
      "Something went wrong talking to the backend.\n\n" +
      (err && err.message ? err.message : String(err))
    );
  } finally {
    disableWhileWorking(false);
    setStatus("");
  }
}

attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  const incoming = Array.from(fileInput.files || []);
  if (!incoming.length) return;

  attachedFiles = [...attachedFiles, ...incoming];
  renderAttachmentPills();

  setStatus(
    attachedFiles.length === 1
      ? "File attached and ready to send."
      : `${attachedFiles.length} files attached and ready to send.`
  );

  fileInput.value = "";
});

micBtn.addEventListener("click", () => {
  setStatus("Voice input is parked for now.");
});

sendBtn.addEventListener("click", handleSend);

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

(function init() {
  addAssistantText("Tell me what’s going on, and we’ll work through it together.");
})();
</script>
</body>
</html>
