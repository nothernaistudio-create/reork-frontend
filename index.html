<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REORK</title>

  <style>
    :root{
      --bg:#0f0f10;
      --panel:#141416;
      --panel2:#17171a;
      --border:#2a2a2e;
      --text:#e9e9ea;
      --muted:#a9a9b2;
      --accent:#ff7a00;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(1200px 700px at 20% 10%, rgba(255,122,0,.08), transparent 55%),
                  radial-gradient(1100px 650px at 80% 0%, rgba(255,255,255,.04), transparent 55%),
                  var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      padding: 18px 26px;
      display:flex;
      align-items:center;
      gap:14px;
      user-select:none;
    }

    /* REORK logo styling stays “tunnel” */
    .brand{
      font-weight:800;
      letter-spacing: 1px;
      font-size: 30px;
      color: var(--accent);
      text-shadow: 0 2px 18px rgba(255,122,0,.12);
    }
    .brand .big{
      font-size: 44px;
      line-height: 1;
      display:inline-block;
      transform: translateY(2px);
    }
    .brand .mid{
      font-size: 30px;
      display:inline-block;
      margin: 0 1px;
      opacity:.95;
    }

    #wrap{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      padding: 0 18px 18px 18px;
      gap:14px;
    }

    #chat{
      flex:1;
      min-height:0;
      overflow:auto;
      padding: 8px 8px 18px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.15) transparent;
    }
    #chat::-webkit-scrollbar{ width:10px; }
    #chat::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.12);
      border-radius: 10px;
      border:2px solid transparent;
      background-clip: padding-box;
    }

    .row{
      display:flex;
      gap:10px;
      margin: 10px 0;
      align-items:flex-end;
    }
    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .bubble{
      max-width: min(860px, 78%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bot .bubble{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-left: 4px solid var(--accent);
      padding-left: 14px;
    }

    .user .bubble{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }

    .meta{
      margin-top:6px;
      font-size:12px;
      color: var(--muted);
      opacity:.85;
    }

    /* Composer */
    #composer{
      border-top: 1px solid rgba(255,255,255,.06);
      padding-top: 14px;
    }

    #composeRow{
      display:flex;
      align-items:stretch;
      gap:10px;
    }

    /* PLUS BUTTON (square orange) */
    #attachBtn{
      width:52px;
      height:52px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 10px 24px rgba(255,122,0,.18);
      flex:0 0 auto;
    }
    #attachBtn:active{ transform: translateY(1px); }
    #attachBtn span{
      font-size: 30px;
      font-weight: 900;
      color:#1a1a1a;
      line-height: 1;
      transform: translateY(-1px);
    }

    /* Input looks like ChatGPT: clears after send, history stays above */
    #inputBox{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    #input{
      width:100%;
      min-height:52px;
      max-height:140px;
      resize:none;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color: var(--text);
      padding: 14px 14px;
      font-size: 16px;
      outline:none;
    }
    #input:focus{
      border-color: rgba(255,122,0,.55);
      box-shadow: 0 0 0 4px rgba(255,122,0,.12);
    }

    /* Attachment pill (inside composer, not that ugly file bar) */
    #attachPill{
      display:none;
      align-items:center;
      gap:10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      padding: 8px 10px;
      width: fit-content;
      max-width: 100%;
    }
    #attachPill .name{
      font-size: 13px;
      color: var(--text);
      max-width: 560px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #attachPill .tag{
      font-size: 12px;
      color: rgba(255,255,255,.85);
      background: rgba(255,122,0,.18);
      border: 1px solid rgba(255,122,0,.28);
      padding: 2px 8px;
      border-radius: 999px;
      flex:0 0 auto;
    }
    #attachPill button{
      border:none;
      background: transparent;
      color: rgba(255,255,255,.75);
      cursor:pointer;
      font-size: 16px;
      padding: 0 6px;
      line-height: 1;
    }

    #actions{
      display:flex;
      gap:10px;
      flex:0 0 auto;
    }

    .btn{
      height:52px;
      padding: 0 18px;
      border-radius: 10px;
      border:none;
      font-weight: 800;
      cursor:pointer;
      letter-spacing:.2px;
      user-select:none;
    }

    #sendBtn{
      background: var(--accent);
      color:#1a1a1a;
      box-shadow: 0 10px 24px rgba(255,122,0,.14);
    }
    #sendBtn:disabled{
      opacity:.6;
      cursor:not-allowed;
      box-shadow:none;
    }

    #resetBtn{
      background: rgba(255,255,255,.10);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.10);
    }

    /* Hidden native file input (we never show it) */
    #fileInput{
      display:none;
    }

    /* Small helper text */
    #hint{
      margin-top:10px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding: 0 4px;
    }

    .status{
      color: rgba(255,255,255,.6);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <span class="big">R</span><span class="mid">EOR</span><span class="big">K</span>
    </div>
  </header>

  <div id="wrap">
    <div id="chat"></div>

    <div id="composer">
      <div id="composeRow">
        <button id="attachBtn" type="button" title="Attach PDF">
          <span>+</span>
        </button>

        <div id="inputBox">
          <textarea id="input" placeholder="Ask REORK anything..."></textarea>

          <div id="attachPill">
            <span class="tag">PDF</span>
            <span class="name" id="attachName"></span>
            <button id="removeAttach" type="button" title="Remove">×</button>
          </div>
        </div>

        <div id="actions">
          <button class="btn" id="sendBtn" type="button">Send</button>
          <button class="btn" id="resetBtn" type="button">Reset</button>
        </div>
      </div>

      <div id="hint">
        <div class="status" id="statusText"></div>
        <div class="status">Enter to send • Shift+Enter for new line</div>
      </div>

      <input id="fileInput" type="file" accept="application/pdf,.pdf" />
    </div>
  </div>

<script>
/**
 * IMPORTANT:
 * This file keeps the same behavior structure used in the 400+ line version:
 * - Chat bubbles
 * - Send to backend with optional PDF via FormData
 * - Keeps history in UI
 * - Reset clears UI + clears local conversation
 *
 * If your existing code had a specific API URL, put it below exactly as it was.
 */

// ==============================
// CONFIG (KEEP YOUR EXISTING URL)
// ==============================
const API_URL = "https://reork-backend.onrender.com/api/chat"; 
// Example: "https://work-backend.onrender.com/api/chat"

// How many prior messages to include when sending (frontend context)
const FRONTEND_CONTEXT_LIMIT = 20;

// ==============================
// STATE
// ==============================
let messages = []; // {role:"user"|"assistant", content:"..."}
let attachedFile = null;

// ==============================
// DOM
// ==============================
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const attachPill = document.getElementById("attachPill");
const attachName = document.getElementById("attachName");
const removeAttach = document.getElementById("removeAttach");
const statusText = document.getElementById("statusText");

// ==============================
// HELPERS
// ==============================
function nowTime() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${hh}:${mm}`;
}

function setStatus(text){
  statusText.textContent = text || "";
}

function scrollToBottom(){
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addBubble(text, who){
  const row = document.createElement("div");
  row.className = "row " + (who === "user" ? "user" : "bot");

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  // Keep it simple: plain text rendering (no markdown parser here)
  bubble.textContent = text;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (who === "user" ? "You" : "REORK") + " • " + nowTime();

  bubble.appendChild(meta);
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function addAssistant(text){
  messages.push({ role:"assistant", content:text });
  addBubble(text, "assistant");
}

function addUser(text){
  messages.push({ role:"user", content:text });
  addBubble(text, "user");
}

function clearAttachment(){
  attachedFile = null;
  fileInput.value = "";
  attachPill.style.display = "none";
  attachName.textContent = "";
}

function showAttachment(file){
  attachedFile = file;
  attachName.textContent = file.name;
  attachPill.style.display = "inline-flex";
}

function getTrimmedContext(){
  // send only the last N messages (frontend context)
  if (messages.length <= FRONTEND_CONTEXT_LIMIT) return messages;
  return messages.slice(messages.length - FRONTEND_CONTEXT_LIMIT);
}

function ensureApiConfigured(){
  if (!API_URL || API_URL.includes("YOUR_EXISTING_RENDER_BACKEND_URL_HERE")) {
    addAssistant("Backend URL isn’t set in index.html yet. Add your Render /api/chat URL into API_URL, then refresh.");
    return false;
  }
  return true;
}

// ==============================
// BACKEND CALL
// ==============================
async function sendToBackend(userText){
  // Uses FormData to support optional PDF upload (same pattern as your previous build)
  const fd = new FormData();

  // user prompt
  fd.append("message", userText);

  // conversation context
  fd.append("history", JSON.stringify(getTrimmedContext()));

  // optional file
  if (attachedFile) {
    fd.append("file", attachedFile, attachedFile.name);
  }

  const resp = await fetch(API_URL, {
    method: "POST",
    body: fd
  });

  if (!resp.ok) {
    const t = await resp.text().catch(()=> "");
    throw new Error(`Backend error (${resp.status}): ${t || resp.statusText}`);
  }

  // Supports either JSON {reply:"..."} or plain text
  const contentType = resp.headers.get("content-type") || "";
  if (contentType.includes("application/json")) {
    const data = await resp.json();
    return (data.reply || data.response || data.message || "").toString();
  } else {
    return (await resp.text()).toString();
  }
}

// ==============================
// UI EVENTS
// ==============================
attachBtn.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  // PDF only (matches accept, but double-check)
  const isPdf = (f.type === "application/pdf") || f.name.toLowerCase().endsWith(".pdf");
  if (!isPdf) {
    clearAttachment();
    addAssistant("For now, PDF only. Please choose a .pdf file.");
    return;
  }
  showAttachment(f);
});

removeAttach.addEventListener("click", () => {
  clearAttachment();
});

resetBtn.addEventListener("click", () => {
  // Clear UI
  chatEl.innerHTML = "";
  // Clear local history
  messages = [];
  // Clear attachment
  clearAttachment();
  // Clear input
  inputEl.value = "";
  setStatus("");
  // Re-add the initial helper message (same vibe as you liked)
  addAssistant("Hey. Tell me what you're working through, and I'll walk with you step by step.\n\nIf you're sharing numbers (price, rate, dates, totals), paste them and I'll translate it into plain English.");
});

async function handleSend(){
  const text = inputEl.value.trim();
  if (!text) return;

  if (!ensureApiConfigured()) return;

  // Add user bubble + clear input like ChatGPT
  addUser(text);
  inputEl.value = "";

  // Disable send while waiting
  sendBtn.disabled = true;
  setStatus("Thinking...");

  try{
    const reply = await sendToBackend(text);
    const safeReply = reply && reply.trim() ? reply.trim() : "I didn’t get a response back. Try again.";
    addAssistant(safeReply);
  }catch(err){
    addAssistant("Something went wrong talking to the backend.\n\n" + (err && err.message ? err.message : String(err)));
  }finally{
    sendBtn.disabled = false;
    setStatus("");
    // Keep attachment selected unless you want it cleared after send:
    // If you want auto-clear attachment after each send, uncomment next line:
    // clearAttachment();
  }
}

sendBtn.addEventListener("click", handleSend);

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// ==============================
// INIT
// ==============================
(function init(){
  // Initial message
  addAssistant("Tell me what’s going on, and we’ll work through it together.");
})();
</script>
</body>
</html>
