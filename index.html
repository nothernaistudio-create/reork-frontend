<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REORK</title>

  <style>
    :root{
      --bg:#121214;
      --panel:#18181b;
      --panel2:#1d1d21;
      --border:#2e2e33;
      --text:#ececef;
      --muted:#a8a8b3;
      --accent:#FF5A1F;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(255,90,31,.10), transparent 55%),
        radial-gradient(1100px 650px at 80% 0%, rgba(255,255,255,.05), transparent 55%),
        var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      padding:18px 26px;
      display:flex;
      align-items:center;
      gap:14px;
      user-select:none;
    }

    .brand{
      font-weight:800;
      letter-spacing:1px;
      font-size:30px;
      color:var(--accent);
      text-shadow:0 2px 18px rgba(255,90,31,.15);
    }
    .brand .big{
      font-size:44px;
      line-height:1;
      display:inline-block;
      transform:translateY(2px);
    }
    .brand .mid{
      font-size:30px;
      display:inline-block;
      margin:0 1px;
      opacity:.95;
    }

    #wrap{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      padding:0 18px 18px 18px;
      gap:14px;
    }

    #chat{
      flex:1;
      min-height:0;
      overflow:auto;
      padding:8px 8px 18px 8px;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,.15) transparent;
    }
    #chat::-webkit-scrollbar{ width:10px; }
    #chat::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.12);
      border-radius:10px;
      border:2px solid transparent;
      background-clip:padding-box;
    }

    .row{
      display:flex;
      gap:10px;
      margin:10px 0;
      align-items:flex-end;
    }
    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .bubble{
      max-width:min(860px, 78%);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px 16px;
      box-shadow:var(--shadow);
      line-height:1.5;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .bot .bubble{
      background:linear-gradient(180deg, var(--panel), var(--panel2));
      border-left:4px solid var(--accent);
      padding-left:14px;
    }

    .user .bubble{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
    }

    .meta{
      margin-top:8px;
      font-size:12px;
      color:var(--muted);
      opacity:.85;
    }

    .message-text{
      white-space:pre-wrap;
      word-break:break-word;
    }

    .file-stack{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:10px;
    }

    .file-card{
      display:flex;
      align-items:center;
      gap:10px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      padding:10px 12px;
      max-width:100%;
    }

    .file-icon{
      font-size:18px;
      line-height:1;
      flex:0 0 auto;
    }

    .file-name{
      font-size:14px;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      min-width:0;
    }

    #composer{
      border-top:1px solid rgba(255,255,255,.06);
      padding-top:14px;
    }

    #composeRow{
      display:flex;
      align-items:stretch;
      gap:10px;
    }

    #attachBtn,
    #micBtn,
    #sendBtn{
      background:var(--accent);
      color:#1a1a1a;
      box-shadow:0 10px 24px rgba(255,90,31,.18);
    }

    #attachBtn,
    #micBtn{
      width:54px;
      height:54px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
      position:relative;
    }

    #attachBtn:active,
    #micBtn:active,
    #sendBtn:active{
      transform:translateY(1px);
    }

    #attachBtn span{
      font-size:30px;
      font-weight:900;
      line-height:1;
      transform:translateY(-1px);
    }

    #micBtn{
      overflow:hidden;
    }

    #micVisual{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:3px;
      width:100%;
      height:100%;
    }

    #micIcon{
      font-size:19px;
      line-height:1;
      transform:translateY(1px);
      color:#1a1a1a;
    }

    #micBars{
      display:flex;
      align-items:flex-end;
      gap:2px;
      height:18px;
      opacity:.0;
      transition:opacity .2s ease;
    }

    #micBars span{
      width:3px;
      height:6px;
      border-radius:999px;
      background:#1a1a1a;
      display:block;
      animation: none;
    }

    #micBtn.listening #micBars{
      opacity:1;
    }

    #micBtn.listening #micBars span:nth-child(1){ animation: micBars 1s infinite ease-in-out .0s; }
    #micBtn.listening #micBars span:nth-child(2){ animation: micBars 1s infinite ease-in-out .15s; }
    #micBtn.listening #micBars span:nth-child(3){ animation: micBars 1s infinite ease-in-out .3s; }
    #micBtn.listening #micBars span:nth-child(4){ animation: micBars 1s infinite ease-in-out .45s; }

    @keyframes micBars{
      0%,100%{ height:6px; opacity:.8; }
      50%{ height:18px; opacity:1; }
    }

    #inputBox{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
    }

    #input{
      width:100%;
      min-height:54px;
      max-height:160px;
      resize:none;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.22);
      color:var(--text);
      padding:14px 14px;
      font-size:16px;
      outline:none;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      letter-spacing:.2px;
    }
    #input:focus{
      border-color:rgba(255,90,31,.55);
      box-shadow:0 0 0 4px rgba(255,90,31,.12);
    }

    #attachPillWrap{
      display:none;
      flex-wrap:wrap;
      gap:8px;
      align-items:flex-start;
    }

    .attach-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:999px;
      padding:8px 10px;
      max-width:100%;
    }

    .attach-pill .tag{
      font-size:12px;
      color:rgba(255,255,255,.9);
      background:rgba(255,90,31,.18);
      border:1px solid rgba(255,90,31,.28);
      padding:2px 8px;
      border-radius:999px;
      flex:0 0 auto;
    }

    .attach-pill .name{
      font-size:13px;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:260px;
    }

    .attach-pill button{
      border:none;
      background:transparent;
      color:rgba(255,255,255,.75);
      cursor:pointer;
      font-size:16px;
      padding:0 4px;
      line-height:1;
    }

    #actions{
      display:flex;
      gap:10px;
      flex:0 0 auto;
    }

    .btn{
      height:54px;
      padding:0 18px;
      border-radius:10px;
      border:none;
      font-weight:800;
      cursor:pointer;
      letter-spacing:.2px;
      user-select:none;
      flex:0 0 auto;
    }

    #sendBtn:disabled,
    #attachBtn:disabled,
    #micBtn:disabled{
      opacity:.6;
      cursor:not-allowed;
      box-shadow:none;
    }

    #fileInput{
      display:none;
    }

    #hint{
      margin-top:10px;
      color:rgba(255,255,255,.55);
      font-size:12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:0 4px;
    }

    .status{
      color:rgba(255,255,255,.65);
      font-size:12px;
      min-height:16px;
    }

    @media (max-width: 820px){
      .bubble{ max-width:92%; }

      #composeRow{
        gap:8px;
      }

      #attachBtn,
      #micBtn,
      .btn{
        height:50px;
      }

      #attachBtn,
      #micBtn{
        width:50px;
      }

      .attach-pill .name{
        max-width:160px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <span class="big">R</span><span class="mid">EOR</span><span class="big">K</span>
    </div>
  </header>

  <div id="wrap">
    <div id="chat"></div>

    <div id="composer">
      <div id="composeRow">
        <button id="attachBtn" type="button" title="Attach files">
          <span>+</span>
        </button>

        <button id="micBtn" type="button" title="Voice input">
          <div id="micVisual">
            <span id="micIcon">🎤</span>
            <div id="micBars">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </button>

        <div id="inputBox">
          <textarea id="input" placeholder="Ask REORK anything..."></textarea>

          <div id="attachPillWrap"></div>
        </div>

        <div id="actions">
          <button class="btn" id="sendBtn" type="button">Send</button>
        </div>
      </div>

      <div id="hint">
        <div class="status" id="statusText"></div>
        <div class="status">Enter to send • Shift+Enter for new line</div>
      </div>

      <input
        id="fileInput"
        type="file"
        multiple
        accept=".pdf,.png,.jpg,.jpeg,.webp,.csv,.txt,.md,.json,.doc,.docx,.xls,.xlsx"
      />
    </div>
  </div>

<script>
const API_URL = "https://reork-backend.onrender.com/api/chat";
const FRONTEND_CONTEXT_LIMIT = 10;
const SILENCE_GRACE_MS = 20000;

let messages = [];
let attachedFiles = [];
let recognition = null;
let isListening = false;
let keepListening = false;
let manualStop = false;

let sessionId = localStorage.getItem("reork_sessionId");
if (!sessionId) {
  sessionId = "sess_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("reork_sessionId", sessionId);
}

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const micBtn = document.getElementById("micBtn");
const fileInput = document.getElementById("fileInput");
const attachPillWrap = document.getElementById("attachPillWrap");
const statusText = document.getElementById("statusText");

function nowTime() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${hh}:${mm}`;
}

function setStatus(text) {
  statusText.textContent = text || "";
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function getTrimmedContext() {
  if (messages.length <= FRONTEND_CONTEXT_LIMIT) return messages;
  return messages.slice(messages.length - FRONTEND_CONTEXT_LIMIT);
}

function ensureApiConfigured() {
  if (!API_URL) {
    addAssistantText("Backend URL is missing.");
    return false;
  }
  return true;
}

function disableWhileWorking(on) {
  sendBtn.disabled = !!on;
  attachBtn.disabled = !!on;
  micBtn.disabled = !!on;
}

function getFileIcon(name = "") {
  const lower = name.toLowerCase();

  if (lower.endsWith(".pdf")) return "📄";
  if (lower.endsWith(".png") || lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".webp")) return "🖼️";
  if (lower.endsWith(".csv") || lower.endsWith(".xls") || lower.endsWith(".xlsx")) return "📊";
  if (lower.endsWith(".doc") || lower.endsWith(".docx")) return "📝";
  return "📎";
}

function getFileTag(name = "", type = "") {
  const lower = name.toLowerCase();
  const t = (type || "").toLowerCase();

  if (t.includes("pdf") || lower.endsWith(".pdf")) return "PDF";
  if (t.includes("png") || lower.endsWith(".png")) return "PNG";
  if (t.includes("jpeg") || t.includes("jpg") || lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "JPG";
  if (lower.endsWith(".webp")) return "WEBP";
  if (lower.endsWith(".csv")) return "CSV";
  if (lower.endsWith(".xls") || lower.endsWith(".xlsx")) return "XLS";
  if (lower.endsWith(".doc") || lower.endsWith(".docx")) return "DOC";
  if (lower.endsWith(".txt")) return "TXT";
  return "FILE";
}

function escapeHtml(str = "") {
  return str
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function createRow(who) {
  const row = document.createElement("div");
  row.className = "row " + (who === "user" ? "user" : "bot");
  return row;
}

function createBubble() {
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  return bubble;
}

function createMeta(who) {
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (who === "user" ? "You" : "REORK") + " • " + nowTime();
  return meta;
}

function createFileStack(files) {
  const stack = document.createElement("div");
  stack.className = "file-stack";

  files.forEach(file => {
    const card = document.createElement("div");
    card.className = "file-card";

    const icon = document.createElement("span");
    icon.className = "file-icon";
    icon.textContent = getFileIcon(file.name);

    const name = document.createElement("div");
    name.className = "file-name";
    name.textContent = file.name;

    card.appendChild(icon);
    card.appendChild(name);
    stack.appendChild(card);
  });

  return stack;
}

function addAssistantText(text) {
  messages.push({ role: "assistant", content: text });

  const row = createRow("assistant");
  const bubble = createBubble();

  const content = document.createElement("div");
  content.className = "message-text";
  content.textContent = text;

  bubble.appendChild(content);
  bubble.appendChild(createMeta("assistant"));
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function addUserMessage(text, files = []) {
  const contentParts = [];
  if (files.length) {
    contentParts.push(files.map(f => f.name).join("\n"));
  }
  if (text) contentParts.push(text);

  messages.push({ role: "user", content: contentParts.join("\n\n") });

  const row = createRow("user");
  const bubble = createBubble();

  if (files.length) {
    bubble.appendChild(createFileStack(files));
  }

  if (text) {
    const content = document.createElement("div");
    content.className = "message-text";
    content.textContent = text;
    bubble.appendChild(content);
  }

  bubble.appendChild(createMeta("user"));
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function renderAttachmentPills() {
  attachPillWrap.innerHTML = "";

  if (!attachedFiles.length) {
    attachPillWrap.style.display = "none";
    return;
  }

  attachPillWrap.style.display = "flex";

  attachedFiles.forEach((file, index) => {
    const pill = document.createElement("div");
    pill.className = "attach-pill";

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = getFileTag(file.name, file.type);

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = file.name;

    const remove = document.createElement("button");
    remove.type = "button";
    remove.title = "Remove";
    remove.textContent = "×";
    remove.addEventListener("click", () => {
      attachedFiles.splice(index, 1);
      renderAttachmentPills();
    });

    pill.appendChild(tag);
    pill.appendChild(name);
    pill.appendChild(remove);
    attachPillWrap.appendChild(pill);
  });
}

function clearAttachments() {
  attachedFiles = [];
  fileInput.value = "";
  renderAttachmentPills();
}

function getSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  const r = new SR();
  r.lang = "en-US";
  r.interimResults = true;
  r.continuous = true;
  return r;
}

function startListening() {
  if (isListening) return;

  const r = getSpeechRecognition();
  if (!r) {
    addAssistantText("Voice input isn’t supported in this browser.");
    return;
  }

  recognition = r;
  keepListening = true;
  manualStop = false;
  isListening = true;
  micBtn.classList.add("listening");
  setStatus("Listening...");

  let finalTranscript = "";
  let lastSpeechAt = Date.now();

  recognition.onresult = (event) => {
    lastSpeechAt = Date.now();

    let interimTranscript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript || "";
      if (event.results[i].isFinal) {
        finalTranscript += transcript + " ";
      } else {
        interimTranscript += transcript;
      }
    }

    const existing = inputEl.dataset.baseText || inputEl.value.trim();
    const combined = [existing, finalTranscript.trim(), interimTranscript.trim()]
      .filter(Boolean)
      .join(" ")
      .trim();

    inputEl.value = combined;
  };

  recognition.onspeechstart = () => {
    lastSpeechAt = Date.now();
  };

  recognition.onend = () => {
    if (manualStop) {
      stopListeningUI();
      return;
    }

    const silenceDuration = Date.now() - lastSpeechAt;

    if (keepListening && silenceDuration < SILENCE_GRACE_MS) {
      try {
        recognition.start();
      } catch (_) {
        stopListeningUI();
      }
    } else {
      stopListeningUI();
    }
  };

  recognition.onerror = () => {
    stopListeningUI();
  };

  try {
    inputEl.dataset.baseText = inputEl.value.trim();
    recognition.start();
  } catch (_) {
    stopListeningUI();
  }
}

function stopListeningUI() {
  isListening = false;
  keepListening = false;
  manualStop = false;
  micBtn.classList.remove("listening");
  if (recognition) {
    try { recognition.stop(); } catch (_) {}
  }
  recognition = null;
  delete inputEl.dataset.baseText;
  setStatus("");
}

function toggleListening() {
  if (isListening) {
    manualStop = true;
    stopListeningUI();
  } else {
    startListening();
  }
}

async function sendSingleRequest(userText, file) {
  const fd = new FormData();
  fd.append("message", userText || "");
  fd.append("sessionId", sessionId);
  fd.append("history", JSON.stringify(getTrimmedContext()));

  if (file) {
    fd.append("file", file, file.name);
  }

  const resp = await fetch(API_URL, { method: "POST", body: fd });

  if (!resp.ok) {
    const t = await resp.text().catch(() => "");
    throw new Error(`Backend error (${resp.status}): ${t || resp.statusText}`);
  }

  const contentType = resp.headers.get("content-type") || "";
  if (contentType.includes("application/json")) {
    const data = await resp.json();
    return (data.reply || data.response || data.message || "").toString();
  } else {
    return (await resp.text()).toString();
  }
}

async function handleSend() {
  const text = inputEl.value.trim();
  const files = [...attachedFiles];

  if (!text && !files.length) return;
  if (!ensureApiConfigured()) return;

  addUserMessage(text, files);

  inputEl.value = "";
  clearAttachments();

  disableWhileWorking(true);
  setStatus("Thinking...");

  try {
    if (!files.length) {
      const reply = await sendSingleRequest(text || "");
      addAssistantText(reply && reply.trim() ? reply.trim() : "I didn’t get a response back. Try again.");
    } else {
      const results = [];

      for (const file of files) {
        const prompt = text || "Please explain what this says.";
        const reply = await sendSingleRequest(prompt, file);

        results.push(`${getFileIcon(file.name)} ${file.name}\n${reply && reply.trim() ? reply.trim() : "No response returned."}`);
      }

      addAssistantText(results.join("\n\n"));
    }
  } catch (err) {
    addAssistantText(
      "Something went wrong talking to the backend.\n\n" +
      (err && err.message ? err.message : String(err))
    );
  } finally {
    disableWhileWorking(false);
    setStatus("");
  }
}

attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  const incoming = Array.from(fileInput.files || []);
  if (!incoming.length) return;

  attachedFiles = [...attachedFiles, ...incoming];
  renderAttachmentPills();
  fileInput.value = "";
});

micBtn.addEventListener("click", toggleListening);
sendBtn.addEventListener("click", handleSend);

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

(function init() {
  addAssistantText("Tell me what’s going on, and we’ll work through it together.");
})();
</script>
</body>
</html>
