<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REORK</title>

  <style>
    :root{
      --bg:#0f0f10;
      --panel:#141416;
      --panel2:#17171a;
      --border:#2a2a2e;
      --text:#e9e9ea;
      --muted:#a9a9b2;
      --accent:#ff7a00;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(1200px 700px at 20% 10%, rgba(255,122,0,.08), transparent 55%),
                  radial-gradient(1100px 650px at 80% 0%, rgba(255,255,255,.04), transparent 55%),
                  var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      padding: 18px 26px;
      display:flex;
      align-items:center;
      gap:14px;
      user-select:none;
    }

    .brand{
      font-weight:800;
      letter-spacing: 1px;
      font-size: 30px;
      color: var(--accent);
      text-shadow: 0 2px 18px rgba(255,122,0,.12);
    }
    .brand .big{
      font-size: 44px;
      line-height: 1;
      display:inline-block;
      transform: translateY(2px);
    }
    .brand .mid{
      font-size: 30px;
      display:inline-block;
      margin: 0 1px;
      opacity:.95;
    }

    #wrap{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      padding: 0 18px 18px 18px;
      gap:14px;
    }

    #chat{
      flex:1;
      min-height:0;
      overflow:auto;
      padding: 8px 8px 18px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.15) transparent;
    }
    #chat::-webkit-scrollbar{ width:10px; }
    #chat::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.12);
      border-radius: 10px;
      border:2px solid transparent;
      background-clip: padding-box;
    }

    .row{
      display:flex;
      gap:10px;
      margin: 10px 0;
      align-items:flex-end;
    }
    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .bubble{
      max-width: min(860px, 78%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
    }

    .bot .bubble{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-left: 4px solid var(--accent);
      padding-left: 14px;
    }

    .user .bubble{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }

    .meta{
      margin-top:6px;
      font-size:12px;
      color: var(--muted);
      opacity:.85;
    }

    #composer{
      border-top: 1px solid rgba(255,255,255,.06);
      padding-top: 14px;
    }

    #composeRow{
      display:flex;
      align-items:stretch;
      gap:10px;
    }

    /* LEFT BUTTONS */
    #leftButtons{
      display:flex;
      gap:10px;
      flex:0 0 auto;
      align-items:stretch;
    }

    /* PLUS BUTTON */
    #attachBtn{
      width:52px;
      height:52px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 10px 24px rgba(255,122,0,.18);
    }
    #attachBtn:active{ transform: translateY(1px); }
    #attachBtn span{
      font-size: 30px;
      font-weight: 900;
      color:#1a1a1a;
      line-height: 1;
      transform: translateY(-1px);
    }

    /* MIC BUTTON (matches +) */
    #micBtn{
      width:52px;
      height:52px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 10px 24px rgba(255,122,0,.18);
      position: relative;
    }
    #micBtn:active{ transform: translateY(1px); }

    /* icon */
    #micBtn svg{
      width:22px;
      height:22px;
      fill:#1a1a1a;
    }

    /* recording state */
    #micBtn.recording{
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 0 0 4px rgba(255,122,0,.12);
    }
    #micBtn.recording svg{
      fill: var(--accent);
    }
    /* subtle pulse ring */
    #micBtn.recording::after{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius: 14px;
      border: 2px solid rgba(255,122,0,.25);
      animation: pulse 1.2s ease-in-out infinite;
      pointer-events:none;
    }

    @keyframes pulse{
      0%   { transform: scale(0.98); opacity: 0.35; }
      50%  { transform: scale(1.05); opacity: 0.65; }
      100% { transform: scale(0.98); opacity: 0.35; }
    }

    #inputBox{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    #input{
      width:100%;
      min-height:52px;
      max-height:140px;
      resize:none;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color: var(--text);
      padding: 14px 14px;
      font-size: 16px;

      /* FIX: make typing look normal, not code */
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.2px;

      outline:none;
    }
    #input:focus{
      border-color: rgba(255,122,0,.55);
      box-shadow: 0 0 0 4px rgba(255,122,0,.12);
    }

    #attachPill{
      display:none;
      align-items:center;
      gap:10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      padding: 8px 10px;
      width: fit-content;
      max-width: 100%;
    }
    #attachPill .name{
      font-size: 13px;
      color: var(--text);
      max-width: 560px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #attachPill .tag{
      font-size: 12px;
      color: rgba(255,255,255,.85);
      background: rgba(255,122,0,.18);
      border: 1px solid rgba(255,122,0,.28);
      padding: 2px 8px;
      border-radius: 999px;
      flex:0 0 auto;
    }
    #attachPill button{
      border:none;
      background: transparent;
      color: rgba(255,255,255,.75);
      cursor:pointer;
      font-size: 16px;
      padding: 0 6px;
      line-height: 1;
    }

    #actions{
      display:flex;
      gap:10px;
      flex:0 0 auto;
    }

    .btn{
      height:52px;
      padding: 0 18px;
      border-radius: 10px;
      border:none;
      font-weight: 800;
      cursor:pointer;
      letter-spacing:.2px;
      user-select:none;
    }

    #sendBtn{
      background: var(--accent);
      color:#1a1a1a;
      box-shadow: 0 10px 24px rgba(255,122,0,.14);
    }
    #sendBtn:disabled{
      opacity:.6;
      cursor:not-allowed;
      box-shadow:none;
    }

    #resetBtn{
      background: rgba(255,255,255,.10);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.10);
    }

    #fileInput{
      display:none;
    }

    #hint{
      margin-top:10px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding: 0 4px;
    }

    .status{
      color: rgba(255,255,255,.6);
      font-size: 12px;
      min-height: 16px;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <span class="big">R</span><span class="mid">EOR</span><span class="big">K</span>
    </div>
  </header>

  <div id="wrap">
    <div id="chat"></div>

    <div id="composer">
      <div id="composeRow">

        <div id="leftButtons">
          <button id="attachBtn" type="button" title="Attach PDF">
            <span>+</span>
          </button>

          <button id="micBtn" type="button" title="Voice input">
            <!-- simple mic icon -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
            </svg>
          </button>
        </div>

        <div id="inputBox">
          <textarea id="input" placeholder="Ask REORK anything..."></textarea>

          <div id="attachPill">
            <span class="tag">PDF</span>
            <span class="name" id="attachName"></span>
            <button id="removeAttach" type="button" title="Remove">×</button>
          </div>
        </div>

        <div id="actions">
          <button class="btn" id="sendBtn" type="button">Send</button>
          <button class="btn" id="resetBtn" type="button">Reset</button>
        </div>
      </div>

      <div id="hint">
        <div class="status" id="statusText"></div>
        <div class="status">Enter to send • Shift+Enter for new line</div>
      </div>

      <input id="fileInput" type="file" accept="application/pdf,.pdf" />
    </div>
  </div>

<script>
/**
 * Frontend responsibilities:
 * - Chat UI
 * - Send message + optional PDF via FormData
 * - Voice input toggle (start/stop) with a safety timeout
 */

// ==============================
// CONFIG
// ==============================
const API_URL = "https://reork-backend.onrender.com/api/chat";
const FRONTEND_CONTEXT_LIMIT = 20;

// Voice safety timeout (prevents “left it recording forever”)
// 45s feels close to ChatGPT behavior without being annoying.
const VOICE_MAX_MS = 45000;

// ==============================
// STATE
// ==============================
let messages = []; // {role:"user"|"assistant", content:"..."}
let attachedFile = null;

// voice state
let recognition = null;
let isRecording = false;
let voiceTimer = null;

// ==============================
// DOM
// ==============================
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const attachPill = document.getElementById("attachPill");
const attachName = document.getElementById("attachName");
const removeAttach = document.getElementById("removeAttach");
const statusText = document.getElementById("statusText");
const micBtn = document.getElementById("micBtn");

// ==============================
// HELPERS
// ==============================
function nowTime() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${hh}:${mm}`;
}

function setStatus(text){
  statusText.textContent = text || "";
}

function scrollToBottom(){
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addBubble(text, who){
  const row = document.createElement("div");
  row.className = "row " + (who === "user" ? "user" : "bot");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (who === "user" ? "You" : "REORK") + " • " + nowTime();

  bubble.appendChild(meta);
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function addAssistant(text){
  messages.push({ role:"assistant", content:text });
  addBubble(text, "assistant");
}

function addUser(text){
  messages.push({ role:"user", content:text });
  addBubble(text, "user");
}

function clearAttachment(){
  attachedFile = null;
  fileInput.value = "";
  attachPill.style.display = "none";
  attachName.textContent = "";
}

function showAttachment(file){
  attachedFile = file;
  attachName.textContent = file.name;
  attachPill.style.display = "inline-flex";
}

function getTrimmedContext(){
  if (messages.length <= FRONTEND_CONTEXT_LIMIT) return messages;
  return messages.slice(messages.length - FRONTEND_CONTEXT_LIMIT);
}

function ensureApiConfigured(){
  if (!API_URL) {
    addAssistant("Backend URL isn’t set in index.html yet. Add your Render /api/chat URL into API_URL, then refresh.");
    return false;
  }
  return true;
}

function disableWhileWorking(on){
  sendBtn.disabled = !!on;
  attachBtn.disabled = !!on;
  micBtn.disabled = !!on;
  if (on) {
    attachBtn.style.opacity = "0.65";
    micBtn.style.opacity = "0.65";
  } else {
    attachBtn.style.opacity = "";
    micBtn.style.opacity = "";
  }
}

// ==============================
// BACKEND CALL
// ==============================
async function sendToBackend(userText){
  const fd = new FormData();
  fd.append("message", userText);
  fd.append("history", JSON.stringify(getTrimmedContext()));
  if (attachedFile) fd.append("file", attachedFile, attachedFile.name);

  const resp = await fetch(API_URL, { method: "POST", body: fd });

  if (!resp.ok) {
    const t = await resp.text().catch(()=> "");
    throw new Error(`Backend error (${resp.status}): ${t || resp.statusText}`);
  }

  const contentType = resp.headers.get("content-type") || "";
  if (contentType.includes("application/json")) {
    const data = await resp.json();
    return (data.reply || data.response || data.message || "").toString();
  } else {
    return (await resp.text()).toString();
  }
}

// ==============================
// FILE UI
// ==============================
attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;

  const isPdf = (f.type === "application/pdf") || f.name.toLowerCase().endsWith(".pdf");
  if (!isPdf) {
    clearAttachment();
    addAssistant("For now, PDF only. Please choose a .pdf file.");
    return;
  }
  showAttachment(f);
});

removeAttach.addEventListener("click", clearAttachment);

// ==============================
// VOICE (TOGGLE START/STOP)
// ==============================
function setupSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;

  const rec = new SR();

  // We want clean text after speaking, not live flicker
  rec.interimResults = false;

  // Keep listening until user stops OR timeout hits
  rec.continuous = true;

  rec.lang = "en-US";

  return rec;
}

function startVoice(){
  if (isRecording) return;

  if (!recognition) recognition = setupSpeech();
  if (!recognition) {
    addAssistant("Voice input isn’t supported in this browser. Try Chrome on desktop.");
    return;
  }

  // Clear any existing timer
  if (voiceTimer) {
    clearTimeout(voiceTimer);
    voiceTimer = null;
  }

  isRecording = true;
  micBtn.classList.add("recording");
  setStatus("Listening… (click mic again to stop)");

  // Accumulate results for this recording session
  let finalText = "";

  recognition.onresult = (event) => {
    // Collect final transcript segments
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const res = event.results[i];
      if (res && res[0] && res.isFinal) {
        finalText += (finalText ? " " : "") + res[0].transcript.trim();
      }
    }
  };

  recognition.onerror = (e) => {
    stopVoice(true);
    addAssistant("Voice input error: " + (e && e.error ? e.error : "unknown"));
  };

  recognition.onend = () => {
    // Browser can end automatically; if we were recording, treat it as stop
    if (!isRecording) return;
    // End can fire after stop() too; we only finalize once in stopVoice()
  };

  // Safety timeout (prevents “left it on”)
  voiceTimer = setTimeout(() => {
    stopVoice(false, true);
  }, VOICE_MAX_MS);

  // Start listening
  try {
    recognition.start();
  } catch (err) {
    // start can throw if called twice quickly
    isRecording = false;
    micBtn.classList.remove("recording");
    setStatus("");
  }

  // When we stop, we need to write the captured text once.
  // We'll do that by hooking into stopVoice which reads from the local closure:
  micBtn._finalTextRef = () => finalText;
}

function stopVoice(silent=false, timedOut=false){
  if (!isRecording) return;

  isRecording = false;
  micBtn.classList.remove("recording");

  if (voiceTimer) {
    clearTimeout(voiceTimer);
    voiceTimer = null;
  }

  setStatus(timedOut ? "Stopped (time limit reached)." : "");

  // Stop recognition
  try { recognition && recognition.stop(); } catch(e){}

  // Finalize into input after a short beat so the last result can land
  setTimeout(() => {
    const getter = micBtn._finalTextRef;
    const text = getter ? getter() : "";
    micBtn._finalTextRef = null;

    // Clean up repeated stutter-y duplicates: simple de-dupe of immediate repeats
    // (Not perfect, but reduces "this this this")
    const cleaned = text
      .replace(/\b(\w+)(\s+\1\b)+/gi, "$1")
      .trim();

    if (!silent) {
      if (cleaned) {
        // Put text in the input box (append if user already typed)
        inputEl.value = (inputEl.value.trim() ? (inputEl.value.trim() + " ") : "") + cleaned;
        inputEl.focus();
      } else if (timedOut) {
        // timed out with no usable speech
        // keep status minimal and not spam the chat
      }
    }
  }, 150);
}

micBtn.addEventListener("click", () => {
  if (!isRecording) startVoice();
  else stopVoice(false, false);
});

// ==============================
// RESET
// ==============================
resetBtn.addEventListener("click", () => {
  chatEl.innerHTML = "";
  messages = [];
  clearAttachment();
  inputEl.value = "";
  setStatus("");

  // stop voice if active
  stopVoice(true, false);

  addAssistant(
    "Hey. Tell me what you're working through, and I'll walk with you step by step.\n\n" +
    "If you're sharing numbers (price, rate, dates, totals), paste them and I'll translate it into plain English."
  );
});

// ==============================
// SEND
// ==============================
async function handleSend(){
  const text = inputEl.value.trim();
  if (!text) return;
  if (!ensureApiConfigured()) return;

  // If mic is recording, stop it before sending
  if (isRecording) stopVoice(true, false);

  addUser(text);
  inputEl.value = "";

  disableWhileWorking(true);
  setStatus("Thinking…");

  try{
    const reply = await sendToBackend(text);
    const safeReply = reply && reply.trim() ? reply.trim() : "I didn’t get a response back. Try again.";
    addAssistant(safeReply);
  }catch(err){
    addAssistant("Something went wrong talking to the backend.\n\n" + (err && err.message ? err.message : String(err)));
  }finally{
    // IMPORTANT: clear attachment after send so it doesn't stick
    clearAttachment();
    disableWhileWorking(false);
    setStatus("");
  }
}

sendBtn.addEventListener("click", handleSend);

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// ==============================
// INIT
// ==============================
(function init(){
  addAssistant("Tell me what’s going on, and we’ll work through it together.");
})();
</script>
</body>
</html>
