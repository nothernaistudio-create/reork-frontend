<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REORK Assistant</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

header {
    padding: 15px;
    background: #111;
    border-bottom: 1px solid #222;
    font-size: 18px;
}

#chat {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
}

.user {
    align-self: flex-end;
    background: #1e88e5;
}

.assistant {
    align-self: flex-start;
    background: #222;
}

footer {
    padding: 10px;
    background: #111;
    border-top: 1px solid #222;
    display: flex;
    gap: 10px;
}

textarea {
    flex: 1;
    resize: none;
    height: 60px;
    border-radius: 8px;
    border: none;
    padding: 10px;
    font-size: 14px;
}

button {
    background: #1e88e5;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    cursor: pointer;
}

button:hover {
    background: #1565c0;
}

.reset-btn {
    background: #444;
}
</style>
</head>

<body>

<header>REORK Assistant</header>

<div id="chat"></div>

<footer>
    <textarea id="messageInput" placeholder="Ask REORK anything..."></textarea>
    <button onclick="sendMessage()">Send</button>
    <button class="reset-btn" onclick="resetConversation()">Reset</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");

function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.textContent = text;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}
