<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REORK</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #1c1c1c;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        padding: 20px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .brand {
        font-size: 28px;
    }

    .brand .big {
        font-size: 42px;
    }

    #chatContainer {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
    }

    .user {
        align-self: flex-end;
        background: #333;
    }

    .assistant {
        align-self: flex-start;
        background: #2a2a2a;
        border-left: 4px solid orange;
    }

    #inputArea {
        display: flex;
        padding: 15px;
        gap: 10px;
        background: #181818;
        border-top: 1px solid #333;
    }

    textarea {
        flex: 1;
        resize: none;
        height: 50px;
        background: #2a2a2a;
        color: #fff;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px;
        font-size: 14px;
    }

    button {
        background: orange;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        opacity: 0.9;
    }

</style>
</head>

<body>

<header>
    <div class="brand">
        <span class="big">R</span>EOR<span class="big">K</span>
    </div>
</header>

<div id="chatContainer"></div>

<div id="inputArea">
    <textarea id="userInput" placeholder="Ask REORK anything..."></textarea>
    <button onclick="sendMessage()">Send</button>
    <button onclick="resetChat()">Reset</button>
</div>

<script>
const chatContainer = document.getElementById("chatContainer");
const userInput = document.getElementById("userInput");

let conversationHistory = [];

function addMessage(text, role) {
    const msg = document.createElement("div");
    msg.classList.add("message", role);
    msg.textContent = text;
    chatContainer.appendChild(msg);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, "user");
    conversationHistory.push({ role: "user", content: text });

    userInput.value = "";

    try {
        const response = await fetch("https://reork-backend.onrender.com/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: conversationHistory })
        });

        const data = await response.json();
        const reply = data.reply || "No response received.";

        addMessage(reply, "assistant");
        conversationHistory.push({ role: "assistant", content: reply });

    } catch (error) {
        addMessage("Error connecting to REORK backend.", "assistant");
    }
}

function resetChat() {
    chatContainer.innerHTML = "";
    conversationHistory = [];
}
</script>

</body>
</html>
