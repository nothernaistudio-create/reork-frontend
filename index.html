<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REORK</title>
  <style>
    :root{
      --bg:#121212;
      --panel:#1b1b1b;
      --panel2:#202020;
      --bubbleUser:#2a2a2a;
      --bubbleBot:#1f1f1f;
      --text:#e8e8e8;
      --muted:#bdbdbd;
      --border:#2f2f2f;
      --accent:#ff7a00; /* REORK orange */
      --accent2:#ff9a3d;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      flex-direction:column;
      height:100vh;
    }
    header{
      padding:18px 20px 10px 20px;
      user-select:none;
    }
    .brand{
      display:flex;
      align-items:flex-end;
      gap:2px;
      letter-spacing:1px;
      font-weight:800;
      line-height:1;
    }
    .brand .big{
      font-size:44px;
      color:var(--accent);
      text-shadow:0 0 0 transparent;
    }
    .brand .mid{
      font-size:28px;
      color:var(--accent);
      opacity:0.95;
      padding-bottom:4px;
    }
    /* Chat area */
    #chatWrap{
      flex:1;
      padding:10px 16px 0 16px;
      overflow:auto;
    }
    #chat{
      max-width:1200px;
      margin:0 auto;
      background:transparent;
      min-height:100%;
      padding:6px 2px 18px 2px;
    }
    .row{
      display:flex;
      margin:10px 0;
      gap:10px;
      align-items:flex-end;
    }
    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .bubble{
      max-width:min(820px, 88%);
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      white-space:pre-wrap;
      word-break:break-word;
      line-height:1.35;
      font-size:14px;
    }
    .user .bubble{
      background:var(--bubbleUser);
    }
    .bot .bubble{
      background:var(--bubbleBot);
      position:relative;
      border-left:3px solid var(--accent);
    }
    .meta{
      font-size:12px;
      color:var(--muted);
      margin:0 6px;
      user-select:none;
    }

    /* Composer */
    #composerWrap{
      border-top:1px solid var(--border);
      background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.25));
      padding:12px 16px 16px 16px;
    }
    #composer{
      max-width:1200px;
      margin:0 auto;
      display:flex;
      gap:12px;
      align-items:flex-end;
    }
    #inputArea{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    textarea{
      width:100%;
      min-height:54px;
      max-height:180px;
      resize:vertical;
      background:var(--panel);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px 12px;
      font-size:14px;
      outline:none;
    }
    textarea:focus{ border-color:#3a3a3a; }
    .tools{
      display:flex;
      gap:10px;
      align-items:center;
      color:var(--muted);
      font-size:12px;
      user-select:none;
    }
    input[type="file"]{
      color:var(--muted);
      max-width:360px;
    }
    .btns{
      display:flex;
      gap:10px;
      align-items:stretch;
    }
    button{
      border:none;
      border-radius:10px;
      padding:12px 16px;
      cursor:pointer;
      font-weight:700;
      font-size:13px;
      min-width:92px;
    }
    button.primary{
      background:var(--accent);
      color:#111;
    }
    button.primary:hover{ background:var(--accent2); }
    button.ghost{
      background:#2a2a2a;
      color:var(--text);
      border:1px solid var(--border);
    }
    button.ghost:hover{ border-color:#3a3a3a; }
    button:disabled{
      opacity:0.55;
      cursor:not-allowed;
    }

    /* Status bar */
    #status{
      max-width:1200px;
      margin:10px auto 0 auto;
      padding:0 2px;
      font-size:12px;
      color:var(--muted);
      min-height:16px;
      user-select:none;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--panel2);
    }
    .dot{
      width:8px;height:8px;border-radius:999px;background:var(--accent);
    }
    .spinner{
      width:14px;height:14px;border-radius:999px;
      border:2px solid #3a3a3a;border-top-color:var(--accent);
      animation:spin 0.9s linear infinite;
      display:inline-block;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    a{ color:var(--accent2); }
  </style>
</head>
<body>
  <header>
    <div class="brand" aria-label="REORK">
      <span class="big">R</span>
      <span class="mid">EOR</span>
      <span class="big">K</span>
    </div>
  </header>

  <div id="chatWrap">
    <div id="chat"></div>
  </div>

  <div id="composerWrap">
    <div id="composer">
      <div id="inputArea">
        <textarea id="message" placeholder="Ask REORK anything…"></textarea>
        <div class="tools">
          <span>Attach PDF (optional):</span>
          <input id="file" type="file" accept=".pdf,application/pdf" />
        </div>
        <div id="status"></div>
      </div>

      <div class="btns">
        <button id="sendBtn" class="primary">Send</button>
        <button id="resetBtn" class="ghost">Reset</button>
      </div>
    </div>
  </div>

  <script>
    // === CONFIG ===
    // If your Render URL is different, change it here (keep /api/chat).
    const API_BASE = "https://reork-backend.onrender.com";
    const CHAT_URL = API_BASE + "/api/chat";
    const RESET_URL = API_BASE + "/api/reset";

    // === SESSION ===
    function getSessionId(){
      let id = localStorage.getItem("reork_session_id");
      if(!id){
        id = "sess_" + Math.random().toString(36).slice(2) + "_" + Date.now().toString(36);
        localStorage.setItem("reork_session_id", id);
      }
      return id;
    }
    const sessionId = getSessionId();

    // === UI HELPERS ===
    const chatEl = document.getElementById("chat");
    const msgEl = document.getElementById("message");
    const fileEl = document.getElementById("file");
    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");
    const statusEl = document.getElementById("status");

    let isSending = false;

    function setStatus(html){
      statusEl.innerHTML = html || "";
    }
    function scrollToBottom(){
      const wrap = document.getElementById("chatWrap");
      wrap.scrollTop = wrap.scrollHeight;
    }

    function addBubble(role, text){
      const row = document.createElement("div");
      row.className = "row " + (role === "user" ? "user" : "bot");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    // Persist visible chat history (UI only)
    function saveUiHistory(){
      const items = [];
      chatEl.querySelectorAll(".row").forEach(row=>{
        const role = row.classList.contains("user") ? "user" : "assistant";
        const text = row.querySelector(".bubble")?.textContent ?? "";
        items.push({ role, text });
      });
      localStorage.setItem("reork_ui_history_" + sessionId, JSON.stringify(items));
    }
    function loadUiHistory(){
      const raw = localStorage.getItem("reork_ui_history_" + sessionId);
      if(!raw) return false;
      try{
        const items = JSON.parse(raw);
        if(!Array.isArray(items) || items.length === 0) return false;
        items.forEach(it=>{
          addBubble(it.role === "user" ? "user" : "assistant", it.text);
        });
        return true;
      }catch{
        return false;
      }
    }

    function bootGreeting(){
      addBubble("assistant",
        "Hey. Tell me what you’re working through, and I’ll walk with you step by step.\n\nIf you’re sharing numbers (price, rate, dates, totals), paste them and I’ll translate it into plain English."
      );
      saveUiHistory();
    }

    // Load previous visible chat
    const hadHistory = loadUiHistory();
    if(!hadHistory) bootGreeting();

    // === NETWORK ===
    async function sendMessage(){
      if(isSending) return;

      const message = (msgEl.value || "").trim();
      const file = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;

      if(!message && !file){
        setStatus(`<span class="pill"><span class="dot"></span>Type a message or attach a PDF.</span>`);
        return;
      }

      isSending = true;
      sendBtn.disabled = true;
      resetBtn.disabled = true;

      // Add user bubble
      if(message) addBubble("user", message);
      else addBubble("user", "[PDF uploaded]");

      // Clear input immediately (ChatGPT-style)
      msgEl.value = "";
      fileEl.value = "";
      setStatus(`<span class="pill"><span class="spinner"></span>Thinking…</span>`);
      saveUiHistory();

      // Create placeholder bot bubble we will fill
      const botBubble = addBubble("assistant", "…");
      saveUiHistory();

      try{
        const form = new FormData();
        form.append("sessionId", sessionId);
        form.append("message", message);
        if(file) form.append("file", file);

        const resp = await fetch(CHAT_URL, { method:"POST", body: form });
        if(!resp.ok){
          const t = await resp.text().catch(()=> "");
          botBubble.textContent = `I hit a technical issue talking to the REORK backend.\n\nStatus: ${resp.status}\n\nIf this keeps happening, check Render logs for /api/chat.\n${t ? ("\nDetails:\n" + t.slice(0, 800)) : ""}`;
          setStatus(`<span class="pill"><span class="dot"></span>Backend error (${resp.status}).</span>`);
        } else {
          const data = await resp.json();
          const reply = (data && (data.reply || data.message || data.output)) ? (data.reply || data.message || data.output) : "";
          botBubble.textContent = reply || "I didn’t receive a reply payload. Check backend response format.";
          setStatus("");
        }
      } catch (err){
        botBubble.textContent = `I couldn’t reach the REORK backend.\n\nCheck:\n• Render is running\n• The API URL in this page is correct\n• CORS is allowed\n\nError: ${String(err)}`;
        setStatus(`<span class="pill"><span class="dot"></span>Network error.</span>`);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        resetBtn.disabled = false;
        saveUiHistory();
        scrollToBottom();
      }
    }

    async function resetConversation(){
      if(isSending) return;

      const ok = confirm("Reset this conversation memory and clear the screen?");
      if(!ok) return;

      isSending = true;
      sendBtn.disabled = true;
      resetBtn.disabled = true;
      setStatus(`<span class="pill"><span class="spinner"></span>Resetting…</span>`);

      try{
        await fetch(RESET_URL, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ sessionId })
        }).catch(()=>null);

        // Clear UI history + screen
        localStorage.removeItem("reork_ui_history_" + sessionId);
        chatEl.innerHTML = "";
        bootGreeting();
        setStatus(`<span class="pill"><span class="dot"></span>Reset complete.</span>`);
        setTimeout(()=>setStatus(""), 1200);
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        resetBtn.disabled = false;
      }
    }

    // === EVENTS ===
    sendBtn.addEventListener("click", sendMessage);

    // Enter to send (Shift+Enter = new line)
    msgEl.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    resetBtn.addEventListener("click", resetConversation);
  </script>
</body>
</html>
