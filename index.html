<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REORK</title>

  <style>
    :root{
      --bg:#0f0f10;
      --panel:#141416;
      --panel2:#17171a;
      --border:#2a2a2e;
      --text:#e9e9ea;
      --muted:#a9a9b2;
      --accent:#ff7a00;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:14px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(1200px 700px at 20% 10%, rgba(255,122,0,.08), transparent 55%),
                  radial-gradient(1100px 650px at 80% 0%, rgba(255,255,255,.04), transparent 55%),
                  var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      padding: 18px 26px;
      display:flex;
      align-items:center;
      gap:14px;
      user-select:none;
    }

    /* REORK logo styling stays “tunnel” */
    .brand{
      font-weight:800;
      letter-spacing: 1px;
      font-size: 30px;
      color: var(--accent);
      text-shadow: 0 2px 18px rgba(255,122,0,.12);
    }
    .brand .big{
      font-size: 44px;
      line-height: 1;
      display:inline-block;
      transform: translateY(2px);
    }
    .brand .mid{
      font-size: 30px;
      display:inline-block;
      margin: 0 1px;
      opacity:.95;
    }

    #wrap{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      padding: 0 18px 18px 18px;
      gap:14px;
    }

    #chat{
      flex:1;
      min-height:0;
      overflow:auto;
      padding: 8px 8px 18px 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.15) transparent;
    }
    #chat::-webkit-scrollbar{ width:10px; }
    #chat::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.12);
      border-radius: 10px;
      border:2px solid transparent;
      background-clip: padding-box;
    }

    .row{
      display:flex;
      gap:10px;
      margin: 10px 0;
      align-items:flex-end;
    }
    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .bubble{
      max-width: min(860px, 78%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bot .bubble{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-left: 4px solid var(--accent);
      padding-left: 14px;
    }

    .user .bubble{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }

    .meta{
      margin-top:6px;
      font-size:12px;
      color: var(--muted);
      opacity:.85;
    }

    /* Composer */
    #composer{
      border-top: 1px solid rgba(255,255,255,.06);
      padding-top: 14px;
    }

    #composeRow{
      display:flex;
      align-items:stretch;
      gap:10px;
    }

    /* PLUS BUTTON (square orange) */
    #attachBtn{
      width:52px;
      height:52px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 10px 24px rgba(255,122,0,.18);
      flex:0 0 auto;
    }
    #attachBtn:active{ transform: translateY(1px); }
    #attachBtn span{
      font-size: 30px;
      font-weight: 900;
      color:#1a1a1a;
      line-height: 1;
      transform: translateY(-1px);
    }

    /* MIC BUTTON (matches size, REORK style) */
    #micBtn{
      width:52px;
      height:52px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
      flex:0 0 auto;
    }
    #micBtn:active{ transform: translateY(1px); }
    #micBtn span{
      font-size: 20px;
      color: var(--accent);
      line-height: 1;
      transform: translateY(1px);
    }
    #micBtn.listening{
      border-color: rgba(255,122,0,.55);
      box-shadow: 0 0 0 4px rgba(255,122,0,.12);
      background: rgba(255,122,0,.08);
    }

    /* Input looks like ChatGPT: clears after send, history stays above */
    #inputBox{
      flex:1;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    #input{
      width:100%;
      min-height:52px;
      max-height:140px;
      resize:none;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.22);
      color: var(--text);
      padding: 14px 14px;
      font-size: 16px;
      outline:none;
    }
    #input:focus{
      border-color: rgba(255,122,0,.55);
      box-shadow: 0 0 0 4px rgba(255,122,0,.12);
    }

    /* Attachment pill */
    #attachPill{
      display:none;
      align-items:center;
      gap:10px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      padding: 8px 10px;
      width: fit-content;
      max-width: 100%;
    }
    #attachPill .name{
      font-size: 13px;
      color: var(--text);
      max-width: 560px;
      overflow:hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #attachPill .tag{
      font-size: 12px;
      color: rgba(255,255,255,.85);
      background: rgba(255,122,0,.18);
      border: 1px solid rgba(255,122,0,.28);
      padding: 2px 8px;
      border-radius: 999px;
      flex:0 0 auto;
    }
    #attachPill button{
      border:none;
      background: transparent;
      color: rgba(255,255,255,.75);
      cursor:pointer;
      font-size: 16px;
      padding: 0 6px;
      line-height: 1;
    }

    #actions{
      display:flex;
      gap:10px;
      flex:0 0 auto;
    }

    .btn{
      height:52px;
      padding: 0 18px;
      border-radius: 10px;
      border:none;
      font-weight: 800;
      cursor:pointer;
      letter-spacing:.2px;
      user-select:none;
    }

    #sendBtn{
      background: var(--accent);
      color:#1a1a1a;
      box-shadow: 0 10px 24px rgba(255,122,0,.14);
    }
    #sendBtn:disabled{
      opacity:.6;
      cursor:not-allowed;
      box-shadow:none;
    }

    #resetBtn{
      background: rgba(255,255,255,.10);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.10);
    }

    /* Hidden native file input */
    #fileInput{
      display:none;
    }

    #hint{
      margin-top:10px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding: 0 4px;
    }

    .status{
      color: rgba(255,255,255,.6);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <span class="big">R</span><span class="mid">EOR</span><span class="big">K</span>
    </div>
  </header>

  <div id="wrap">
    <div id="chat"></div>

    <div id="composer">
      <div id="composeRow">
        <button id="attachBtn" type="button" title="Attach file">
          <span>+</span>
        </button>

        <button id="micBtn" type="button" title="Voice input">
          <span>🎤</span>
        </button>

        <div id="inputBox">
          <textarea id="input" placeholder="Ask REORK anything..."></textarea>

          <div id="attachPill">
            <span class="tag" id="attachTag">FILE</span>
            <span class="name" id="attachName"></span>
            <button id="removeAttach" type="button" title="Remove">×</button>
          </div>
        </div>

        <div id="actions">
          <button class="btn" id="sendBtn" type="button">Send</button>
          <button class="btn" id="resetBtn" type="button">Reset</button>
        </div>
      </div>

      <div id="hint">
        <div class="status" id="statusText"></div>
        <div class="status">Enter to send • Shift+Enter for new line</div>
      </div>

      <!-- Allow PDFs + images. Backend will read PDFs today; images are groundwork for later. -->
      <input id="fileInput" type="file" accept="application/pdf,.pdf,image/png,image/jpeg,image/jpg,.png,.jpg,.jpeg" />
    </div>
  </div>

<script>
/**
 * This version keeps your structure and UI, but fixes:
 * - Frontend sending sessionId (backend memory)
 * - Frontend sending files correctly (FormData)
 * - Clears attachment after send (so it doesn't stick)
 * - Adds mic button (speech-to-text) in the same composer row
 * - Reset also clears backend memory via /api/reset
 */

// ==============================
// CONFIG
// ==============================
const API_URL = "https://reork-backend.onrender.com/api/chat";
const RESET_URL = "https://reork-backend.onrender.com/api/reset";
const FRONTEND_CONTEXT_LIMIT = 20;

// ==============================
// STATE
// ==============================
let messages = []; // {role:"user"|"assistant", content:"..."}
let attachedFile = null;

// Persist a sessionId so backend memory works per user session
let sessionId = localStorage.getItem("reork_sessionId");
if (!sessionId) {
  sessionId = "sess_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("reork_sessionId", sessionId);
}

// Speech recognition state
let recognition = null;
let isListening = false;

// ==============================
// DOM
// ==============================
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const attachBtn = document.getElementById("attachBtn");
const micBtn = document.getElementById("micBtn");
const fileInput = document.getElementById("fileInput");
const attachPill = document.getElementById("attachPill");
const attachName = document.getElementById("attachName");
const attachTag = document.getElementById("attachTag");
const removeAttach = document.getElementById("removeAttach");
const statusText = document.getElementById("statusText");

// ==============================
// HELPERS
// ==============================
function nowTime() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${hh}:${mm}`;
}

function setStatus(text){
  statusText.textContent = text || "";
}

function scrollToBottom(){
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addBubble(text, who){
  const row = document.createElement("div");
  row.className = "row " + (who === "user" ? "user" : "bot");

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = (who === "user" ? "You" : "REORK") + " • " + nowTime();

  bubble.appendChild(meta);
  row.appendChild(bubble);
  chatEl.appendChild(row);
  scrollToBottom();
}

function addAssistant(text){
  messages.push({ role:"assistant", content:text });
  addBubble(text, "assistant");
}

function addUser(text){
  messages.push({ role:"user", content:text });
  addBubble(text, "user");
}

function clearAttachment(){
  attachedFile = null;
  fileInput.value = "";
  attachPill.style.display = "none";
  attachName.textContent = "";
  attachTag.textContent = "FILE";
}

function showAttachment(file){
  attachedFile = file;
  attachName.textContent = file.name;

  const name = (file.name || "").toLowerCase();
  const type = (file.type || "").toLowerCase();

  if (type.includes("pdf") || name.endsWith(".pdf")) attachTag.textContent = "PDF";
  else if (type.includes("png") || name.endsWith(".png")) attachTag.textContent = "PNG";
  else if (type.includes("jpeg") || type.includes("jpg") || name.endsWith(".jpg") || name.endsWith(".jpeg")) attachTag.textContent = "JPG";
  else attachTag.textContent = "FILE";

  attachPill.style.display = "inline-flex";
}

function getTrimmedContext(){
  if (messages.length <= FRONTEND_CONTEXT_LIMIT) return messages;
  return messages.slice(messages.length - FRONTEND_CONTEXT_LIMIT);
}

function ensureApiConfigured(){
  if (!API_URL) {
    addAssistant("Backend URL isn’t set in index.html yet. Add your Render /api/chat URL into API_URL, then refresh.");
    return false;
  }
  return true;
}

function disableWhileWorking(on){
  sendBtn.disabled = !!on;
  attachBtn.disabled = !!on;
  micBtn.disabled = !!on;
  resetBtn.disabled = !!on;
}

// ==============================
// BACKEND CALL
// ==============================
async function sendToBackend(userText){
  const fd = new FormData();

  // Backend expects these fields:
  fd.append("message", userText);
  fd.append("sessionId", sessionId);

  // Keep sending history (even if backend ignores it today, it doesn't break anything)
  fd.append("history", JSON.stringify(getTrimmedContext()));

  if (attachedFile) {
    fd.append("file", attachedFile, attachedFile.name);
  }

  const resp = await fetch(API_URL, { method: "POST", body: fd });

  if (!resp.ok) {
    const t = await resp.text().catch(()=> "");
    throw new Error(`Backend error (${resp.status}): ${t || resp.statusText}`);
  }

  const contentType = resp.headers.get("content-type") || "";
  if (contentType.includes("application/json")) {
    const data = await resp.json();
    return (data.reply || data.response || data.message || "").toString();
  } else {
    return (await resp.text()).toString();
  }
}

async function resetBackendMemory(){
  // Not fatal if it fails, but we try.
  try{
    await fetch(RESET_URL, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({ sessionId })
    });
  }catch(_){}
}

// ==============================
// UI EVENTS
// ==============================
attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  showAttachment(f);
});

removeAttach.addEventListener("click", () => clearAttachment());

resetBtn.addEventListener("click", async () => {
  // Clear UI + local history
  chatEl.innerHTML = "";
  messages = [];
  clearAttachment();
  inputEl.value = "";
  setStatus("");

  // Clear backend memory too
  await resetBackendMemory();

  addAssistant("Tell me what’s going on, and we’ll work through it together.");
});

// ==============================
// VOICE INPUT (Speech → Text)
// ==============================
function getSpeechRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = "en-US";
  r.interimResults = true;
  r.continuous = false;
  return r;
}

function startListening(){
  if (isListening) return;

  const r = getSpeechRecognition();
  if (!r) {
    addAssistant("Voice input isn’t supported in this browser. If you want it, use Chrome on desktop.");
    return;
  }

  recognition = r;
  isListening = true;
  micBtn.classList.add("listening");
  setStatus("Listening…");

  let finalText = "";

  recognition.onresult = (event) => {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const chunk = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += chunk;
      else interim += chunk;
    }

    // Show interim in the input without committing it permanently
    const base = inputEl.value;
    // If user is actively typing, we don't wipe it. We append voice after a space.
    const prefix = base && !base.endsWith(" ") ? base + " " : base;
    inputEl.value = prefix + (finalText || interim);
  };

  recognition.onerror = () => {
    stopListening();
    setStatus("");
  };

  recognition.onend = () => {
    stopListening();
  };

  try{
    recognition.start();
  }catch(_){
    stopListening();
  }
}

function stopListening(){
  isListening = false;
  micBtn.classList.remove("listening");
  if (recognition) {
    try{ recognition.stop(); }catch(_){}
  }
  recognition = null;
  setStatus("");
}

micBtn.addEventListener("click", () => {
  if (isListening) stopListening();
  else startListening();
});

// ==============================
// SEND MESSAGE
// ==============================
async function handleSend(){
  const text = inputEl.value.trim();

  // Allow sending even if only a file is attached
  if (!text && !attachedFile) return;
  if (!ensureApiConfigured()) return;

  // User bubble
  addUser(text || "[Attached file]");
  inputEl.value = "";

  disableWhileWorking(true);
  setStatus("Thinking...");

  try{
    const reply = await sendToBackend(text || "");
    const safeReply = reply && reply.trim() ? reply.trim() : "I didn’t get a response back. Try again.";
    addAssistant(safeReply);
  }catch(err){
    addAssistant("Something went wrong talking to the backend.\n\n" + (err && err.message ? err.message : String(err)));
  }finally{
    // IMPORTANT: clear attachment after send so it doesn't stick in the bar
    clearAttachment();

    disableWhileWorking(false);
    setStatus("");
  }
}

sendBtn.addEventListener("click", handleSend);

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

// ==============================
// INIT
// ==============================
(function init(){
  addAssistant("Tell me what’s going on, and we’ll work through it together.");
})();
</script>
</body>
</html>
