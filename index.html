<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REORK</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #1c1c1c;
  color: #eee;
  padding: 20px;
}

h1 {
  color: #ff7a00;
  font-size: 32px;
  margin-bottom: 10px;
}

#chatWindow {
  height: 400px;
  overflow-y: auto;
  border: 1px solid #333;
  padding: 10px;
  background: #2a2a2a;
  margin-bottom: 10px;
  border-radius: 6px;
}

.user {
  text-align: right;
  margin: 6px 0;
  color: #ffffff;
}

.assistant {
  text-align: left;
  margin: 6px 0;
  color: #ffb347;
}

#inputBar {
  display: flex;
  gap: 10px;
}

textarea {
  flex: 1;
  height: 55px;
  background: #333;
  color: white;
  border: 1px solid #555;
  padding: 10px;
  border-radius: 6px;
  resize: none;
  font-size: 14px;
}

button {
  background: #ff7a00;
  border: none;
  padding: 10px 16px;
  color: white;
  cursor: pointer;
  font-weight: bold;
  border-radius: 6px;
  font-size: 14px;
}

button:hover {
  background: #ff9c33;
}
</style>
</head>

<body>

<h1>REORK</h1>

<div id="chatWindow"></div>

<div id="inputBar">
  <textarea id="messageInput" placeholder="Ask REORK anything..."></textarea>
  <button onclick="sendMessage()">Send</button>
  <button onclick="resetChat()">Reset</button>
</div>

<script>
const chatWindow = document.getElementById("chatWindow");
const messageInput = document.getElementById("messageInput");

function addMessage(role, text) {
  const msg = document.createElement("div");
  msg.className = role;
  msg.innerText = text;
  chatWindow.appendChild(msg);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

async function sendMessage() {
  const message = messageInput.value.trim();
  if (!message) return;

  addMessage("user", "You: " + message);
  messageInput.value = "";

  const response = await fetch("https://reork-backend.onrender.com/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message })
  });

  const data = await response.json();
  addMessage("assistant", "REORK: " + data.reply);
}

async function resetChat() {
  await fetch("https://reork-backend.onrender.com/api/reset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionId: "default" })
  });

  chatWindow.innerHTML = "";
}
</script>

</body>
</html>
