name: REORK Workflow Studio Tests
on:
  pull_request:
    paths:
      - 'services/ai-workflows/**'
      - '.github/workflows/workflow-studio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test services/ai-workflows/studio.test.js
